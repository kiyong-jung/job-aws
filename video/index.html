<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JOB AWS 데모 영상</title>
  <meta name="description" content="공고에서 합격까지, JOB AWS. AWS 공고 한 건이 역량, 프로젝트, 교육자료, 12주 계획, 면접 리포트로 가는 데모 영상입니다.">
  <link rel="icon" type="image/png" href="../static/img/mark.png">
  <style>
    @font-face { font-family: "Pretendard"; src: url("../static/fonts/PretendardVariable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    :root { --paper: #faf9f5; --ink: #2b2a27; --accent: #c6613f; --line: #e3e0d6; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Pretendard", "Apple SD Gothic Neo", system-ui, sans-serif; }
    main { max-width: 1040px; margin: 0 auto; padding: 28px 16px 48px; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    header img { width: 36px; height: 36px; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); font-weight: 800; }
    p { margin: 0 0 20px; font-size: 18px; line-height: 1.6; }
    video { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 12px; background: #000; }
    a.go { display: inline-block; margin-top: 20px; padding: 12px 20px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 18px; font-weight: 700; text-decoration: none; }
    a.go:hover { background: var(--accent); }
  </style>
</head>
<body>
  <main>
    <header><img src="../static/img/mark.png" alt=""><h1>JOB AWS 데모 영상</h1></header>
    <p>공고에서 합격까지. AWS 공고 한 건이 역량, 프로젝트, 교육자료, 12주 계획, 면접 리포트로 이어지는 과정을 1분 20초에 보여 드립니다.</p>
    <video src="job-aws-demo.mp4" poster="poster.jpg" controls playsinline preload="metadata"></video>
    <a class="go" href="../">데모 직접 해 보기</a>
  </main>
</body>
</html>
